[project]
name = "wildcat-slam"
version = "0.1.0"
description = "Python orchestration for the Wildcat SLAM C++ core"
readme = "wildcat/README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "rosbags>=0.10.9",
]

[project.scripts]
process-bag = "wildcat.cli:main"

[project.optional-dependencies]
visualization = [
    "rerun-sdk>=0.28.1",
]

[tool.uv]
package = true

[build-system]
requires = [
    "scikit-build-core>=0.11,<2",
    "pybind11>=3.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "cmake-build-scikit/{wheel_tag}"
build.targets = ["wildcat_slam"]
wheel.packages = ["wildcat"]
